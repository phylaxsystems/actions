name: Publish NPM Package

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the artifact to download (optional)"
        required: false
        type: string
        default: ""
      artifacts_path:
        description: "Path for artifacts to be published"
        required: false
        type: string
        default: ""
      ignore_scripts:
        description: "Whether to ignore npm scripts during publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # npm >= 11.5.1 is required for OIDC trusted publishing. Installing the
      # current CLI keeps that requirement independent of the runner image.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          # Extract tag name
          TAG_VERSION=${GITHUB_REF#refs/tags/}

          # Get version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "Package.json version: $PACKAGE_VERSION"

          # Check if versions match
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Download artifacts
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifacts_path }}

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts=${{ inputs.ignore_scripts }}
